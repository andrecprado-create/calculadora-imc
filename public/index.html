<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de IMC - API</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Calculadora de IMC</h1>
    <p class="subtitle">Cálculo processado via API no Backend</p>

    <form id="imc-form">
      <div class="input-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 75.5" required />
      </div>

      <div class="input-group">
        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" step="0.01" min="0.5" max="2.5" placeholder="Ex: 1.75" required />
      </div>

      <button type="submit" id="btn-calcular">Calcular IMC</button>
    </form>

    <section id="resultado" class="resultado hidden">
      <p>Seu IMC é: <strong id="valor-imc">--</strong></p>
      <p>Classificação: <span id="texto-classificacao" class="badge">--</span></p>
    </section>

    <p id="erro" class="erro hidden"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
